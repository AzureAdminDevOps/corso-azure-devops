trigger:
- main

# Fallback UD14: usare solo se Microsoft-hosted non è disponibile.
pool:
  name: pool-ud09-wsl

variables:
  dockerRegistryServiceConnection: 'sc-acr-ud14'
  imageRepository: 'catalog-backend'
  dockerfilePath: '$(Build.SourcesDirectory)/app/catalog-backend-ci/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)/app/catalog-backend-ci'
  imageTag: '$(Build.BuildId)'

stages:

- stage: Test
  displayName: Test application
  jobs:
  - job: PythonTests
    displayName: Python tests on self-hosted agent

    workspace:
      clean: all

    steps:

    - checkout: self
      clean: true

    - bash: |
        echo "Agent.Name=$(Agent.Name)"
        echo "Agent.OS=$(Agent.OS)"
        echo "Agent.MachineName=$(Agent.MachineName)"
        echo "Build.SourcesDirectory=$(Build.SourcesDirectory)"
        echo
        python3 --version
      displayName: Inspect self-hosted test environment

    - bash: |
        python3 -m unittest discover \
          -s app/catalog-backend-ci/tests \
          -v
      displayName: Run Python tests

- stage: BuildPush
  displayName: Build and push image
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: DockerBuild
    displayName: Docker build on self-hosted agent

    workspace:
      clean: all

    steps:

    - checkout: self
      clean: true

    - bash: |
        echo "Agent.Name=$(Agent.Name)"
        echo "Agent.OS=$(Agent.OS)"
        echo "Agent.MachineName=$(Agent.MachineName)"
        echo "Build.SourcesDirectory=$(Build.SourcesDirectory)"
        echo
        docker --version
        docker info >/dev/null
      displayName: Inspect self-hosted Docker environment

    - task: Docker@2
      displayName: Build and push to ACR
      inputs:
        command: buildAndPush
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: '$(dockerfilePath)'
        buildContext: '$(buildContext)'
        tags: |
          $(imageTag)
