services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: catalog-backend:ud10
    environment:
      APP_PORT: "8000"
      LOW_STOCK_THRESHOLD: "5"
      RUNTIME_DIR: "/runtime"
    volumes:
      - catalog-runtime:/runtime
    expose:
      - "8000"
    networks:
      - catalog-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: catalog-frontend:ud10
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - catalog-net

networks:
  catalog-net:
    driver: bridge

volumes:
  catalog-runtime:
